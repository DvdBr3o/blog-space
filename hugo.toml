# baseURL = 'blog-space-ten.vercel.app'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'DvdBr3o'
theme = [ 'stack', 'admonitions' ]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
    # 保留 LaTeX 原文，避免 _ ^ * 等被 Markdown 当成强调/斜体而破坏公式
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    # hl_Lines = ""
    lineAnchors = ""
    lineNoStart =1
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4

[params]
favicon="/dvdbr3o.ico"